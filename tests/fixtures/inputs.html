<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>Field tests</title><style>body{padding:40px;font:16px sans-serif}input,textarea,[contenteditable]{display:block;width:380px;padding:12px;margin:12px;border:1px solid #aaa}button{margin:12px}#outside{position:fixed;top:20px;right:20px}</style><form id="first-form"><input id="first" name="query" placeholder="输入内容"><input id="second" name="other" placeholder="输入内容"><textarea id="multi"></textarea><button id="submit">提交</button></form><form id="second-form"><input name="query" id="third"></form><input id="password" type="password"><input id="otp" autocomplete="one-time-code"><input id="readonly" readonly><input id="ignored" data-retrospection="off"><div id="editable" contenteditable="true"></div><button id="outside">离开</button><script>document.querySelectorAll('form').forEach(form=>form.addEventListener('submit', e=>e.preventDefault()));window.changes=[];document.addEventListener('input',e=>window.changes.push(['input',e.target.id,e.target.value]));document.addEventListener('change',e=>window.changes.push(['change',e.target.id,e.target.value]));</script></html>
